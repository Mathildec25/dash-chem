# nginx site for REACTO behind HTTPS. Install with:
#   cp deploy/nginx-reacto.conf /etc/nginx/sites-available/reacto
#   ln -s /etc/nginx/sites-available/reacto /etc/nginx/sites-enabled/reacto
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d reacto.fsc.uliege.be      # adds the certificate and the HTTPS redirect
server {
    listen 80;
    server_name reacto.fsc.uliege.be;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a live optimiser step can take 15 s; do not cut the request short
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
}
