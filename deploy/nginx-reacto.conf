# nginx site for REACTO on reacto.fsc.uliege.be, as installed on the VM
# fsc-cloud163 (15 September 2026). The certificate and key were issued by
# SEGI in July 2026 and live in /etc/nginx/ssl/; check the expiry with
#   openssl x509 -in /etc/nginx/ssl/Cert_bundle.pem -noout -enddate
# Install with:
#   cp deploy/nginx-reacto.conf /etc/nginx/sites-available/reacto
#   ln -sf /etc/nginx/sites-available/reacto /etc/nginx/sites-enabled/reacto
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
# (Let's Encrypt is not an option there: port 80 is not reachable from the
# public internet, so the ACME validation times out.)
#
# The SEGI certificate of July 2026 was found REVOKED on 15 September; a new
# one has been requested. Until it is installed, port 80 serves the app
# directly so that the site stays usable from the university network. Once
# the certificate is valid, replace the first server block by:
#     server { listen 80; server_name reacto.fsc.uliege.be;
#              return 301 https://$host$request_uri; }
server {
    listen 80;
    server_name reacto.fsc.uliege.be;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
}

server {
    listen 443 ssl;
    server_name reacto.fsc.uliege.be;

    ssl_certificate     /etc/nginx/ssl/Cert_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/privateKey_nopass.pem;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a live optimiser step can take 15 s; do not cut the request short
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
}
